# Dev: `docker compose up -d postgres` and run core from IDEA.
# Demo: `docker compose up --build` runs everything.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: astra
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra -d astra"]
      interval: 3s
      timeout: 3s
      retries: 20

  core:
    build: ./core
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/astra
      DB_USER: astra
      DB_PASSWORD: astra
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"
    profiles: ["full"]

volumes:
  pgdata:
