spring:
  application:
    name: astra-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/astra}
    username: ${DB_USER:astra}
    password: ${DB_PASSWORD:astra}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway only
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 100         # batch inserts for telemetry (needs SEQUENCE ids, not IDENTITY)
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

astra:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  replan:
    horizon-hours: 72
    solver-time-limit-seconds: 5
    monte-carlo-runs: 2000
    seed: 42
